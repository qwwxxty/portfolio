<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" role="img" aria-labelledby="t">
  <title id="t">Placeholder: portrait of Artur Kulik at the edit desk</title>
  <defs>
    <radialGradient id="warm" cx="18%" cy="40%" r="70%">
      <stop offset="0" stop-color="#f75f4c" stop-opacity=".38"/>
